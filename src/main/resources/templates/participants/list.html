<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Participants | Gatherly</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav th:replace="~{fragments :: navbar}"></nav>
<main class="page-shell"><div th:replace="~{fragments :: alerts}"></div>
    <div class="page-header"><div><p class="eyebrow">PEOPLE DIRECTORY</p><h1>Participants</h1><p class="muted">Know who is coming, wherever they registered.</p></div><a class="button button-primary" th:href="@{/participants/new}">+ Register participant</a></div>
    <form class="search-bar" method="get" th:action="@{/participants}"><span class="search-icon">⌕</span><input type="search" name="query" th:value="${query}" placeholder="Search by participant name or ID"><button class="button button-dark" type="submit">Search</button><a class="clear-link" th:if="${query != null and !query.isEmpty()}" th:href="@{/participants}">Clear</a></form>
    <div class="result-note" th:if="${query != null and !query.isEmpty()}">Showing results for <strong th:text="'“' + ${query} + '”'">query</strong></div>
    <section class="table-card" th:if="${!#lists.isEmpty(participants)}"><div class="table-wrap"><table><thead><tr><th>Participant</th><th>Registered event</th><th class="align-right">Actions</th></tr></thead><tbody><tr th:each="participant : ${participants}"><td><div class="table-event"><span class="avatar" th:text="${#strings.substring(participant.name, 0, 1).toUpperCase()}">P</span><div><strong th:text="${participant.name}">Participant</strong><small th:text="'ID #' + ${participant.participantId}">ID</small></div></div></td><td><a class="people-link" th:if="${participant.eventId > 0}" th:href="@{/events/{id}/participants(id=${participant.eventId})}" th:text="'Event #' + ${participant.eventId}">Event</a><span class="muted" th:if="${participant.eventId <= 0}">General registration</span></td><td class="align-right"><form method="post" th:action="@{/participants/{id}/delete(id=${participant.participantId})}" onsubmit="return confirm('Remove this participant?');"><button class="icon-button danger" title="Delete" type="submit">⌫</button></form></td></tr></tbody></table></div></section>
    <div class="empty-state compact" th:if="${#lists.isEmpty(participants)}"><div class="empty-icon">♧</div><h3 th:text="${query != null and !query.isEmpty() ? 'No matching participants' : 'No participants yet'}">No participants yet</h3><p th:text="${query != null and !query.isEmpty() ? 'Try another search term.' : 'Register your first guest to get started.'}">Register your first guest to get started.</p><a class="button button-primary" th:if="${query == null or query.isEmpty()}" th:href="@{/participants/new}">Register participant</a></div>
</main><div th:replace="~{fragments :: footer}"></div></body></html>
