<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Events | Gatherly</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav th:replace="~{fragments :: navbar}"></nav>
<main class="page-shell"><div th:replace="~{fragments :: alerts}"></div>
    <div class="page-header"><div><p class="eyebrow">EVENT DIRECTORY</p><h1>All events</h1><p class="muted">Keep every detail in one easy-to-scan place.</p></div><a class="button button-primary" th:href="@{/events/new}">+ Add event</a></div>
    <form class="search-bar" method="get" th:action="@{/events}"><span class="search-icon">⌕</span><input type="search" name="query" th:value="${query}" placeholder="Search by name, date, venue, or ID"><button class="button button-dark" type="submit">Search</button><a class="clear-link" th:if="${query != null and !query.isEmpty()}" th:href="@{/events}">Clear</a></form>
    <div class="result-note" th:if="${query != null and !query.isEmpty()}">Showing results for <strong th:text="'“' + ${query} + '”'">query</strong></div>
    <section class="table-card" th:if="${!#lists.isEmpty(events)}"><div class="table-wrap"><table><thead><tr><th>Event</th><th>Date</th><th>Venue</th><th>People</th><th class="align-right">Actions</th></tr></thead><tbody><tr th:each="event : ${events}"><td><div class="table-event"><span class="mini-mark">✦</span><div><strong th:text="${event.eventName}">Event name</strong><small th:text="'ID #' + ${event.eventId}">ID</small></div></div></td><td th:text="${event.eventDate}">Date</td><td th:text="${event.venue}">Venue</td><td><a class="people-link" th:href="@{/events/{id}/participants(id=${event.eventId})}">View people →</a></td><td class="align-right"><div class="actions"><a class="icon-button" title="Edit" th:href="@{/events/{id}/edit(id=${event.eventId})}">✎</a><form method="post" th:action="@{/events/{id}/delete(id=${event.eventId})}" onsubmit="return confirm('Delete this event and its participants?');"><button class="icon-button danger" title="Delete" type="submit">⌫</button></form></div></td></tr></tbody></table></div></section>
    <div class="empty-state compact" th:if="${#lists.isEmpty(events)}"><div class="empty-icon">⌕</div><h3 th:text="${query != null and !query.isEmpty() ? 'No matching events' : 'No events yet'}">No events yet</h3><p th:text="${query != null and !query.isEmpty() ? 'Try another search term.' : 'Your next great gathering starts here.'}">Your next great gathering starts here.</p><a class="button button-primary" th:if="${query == null or query.isEmpty()}" th:href="@{/events/new}">Add event</a></div>
</main><div th:replace="~{fragments :: footer}"></div></body></html>
